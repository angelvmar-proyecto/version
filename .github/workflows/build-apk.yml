name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Verificar plugin ML Kit
        run: |
          echo "🔍 Verificando plugin ML Kit..."
          ls node_modules/@capacitor-mlkit/ 2>/dev/null || echo "❌ Falta"
          cat node_modules/@capacitor-mlkit/text-recognition/package.json | grep version || echo "❌ No encontrado"

      - name: Regenerar Android
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Verificar que el plugin llegó a Android
        run: |
          grep -i mlkit android/app/capacitor.build.gradle && echo "✅ Plugin registrado" || echo "❌ No registrado"

      - name: Dar permisos a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/MarCaribe-v12.apk
          ls -lh output/

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MarCaribe-APK
          path: output/MarCaribe-v12.apk
          retention-days: 30
