name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Limpiar caché de npm y gradle
        run: |
          rm -rf ~/.npm ~/.gradle || true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Verificar archivos .gz ANTES de Capacitor
        run: |
          echo "🔍 Verificando .gz en www/"
          ls -lh www/tesseract/lang-data/
          if [ ! -f "www/tesseract/lang-data/spa.traineddata.gz" ]; then
            echo "❌ FALTA spa.traineddata.gz"
            exit 1
          fi
          if [ ! -f "www/tesseract/lang-data/eng.traineddata.gz" ]; then
            echo "❌ FALTA eng.traineddata.gz"
            exit 1
          fi
          echo "✅ Los 2 .gz están presentes"

      - name: Agregar Android (forzado, borra si existe)
        run: |
          rm -rf android
          npx cap add android
          npx cap sync

      - name: Verificar .gz DESPUÉS de Capacitor sync
        run: |
          echo "🔍 Verificando .gz en android/app/src/main/assets/public/"
          ls -lh android/app/src/main/assets/public/tesseract/lang-data/ 2>/dev/null || echo "⚠️ Carpeta no existe"
          if [ ! -f "android/app/src/main/assets/public/tesseract/lang-data/spa.traineddata.gz" ]; then
            echo "❌ FALTA spa.traineddata.gz en android/assets"
            echo "Buscando en otra ubicación..."
            find android -name "*.traineddata.gz" 2>/dev/null
            exit 1
          fi
          echo "✅ Los 2 .gz pasaron a android/assets"

      - name: Parchear build.gradle con aaptOptions
        run: |
          cd android/app
          python3 << 'PYEOF'
          with open('build.gradle', 'r') as f:
              contenido = f.read()
          
          if 'aaptOptions' not in contenido:
              contenido = contenido.replace(
                  'android {',
                  'android {\n    aaptOptions {\n        noCompress "gz", "traineddata"\n        ignoreAssetsPattern "!.svn:!.git:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~"\n    }',
                  1
              )
              with open('build.gradle', 'w') as f:
                  f.write(contenido)
              print('✅ aaptOptions añadido')
          else:
              print('⚠️  aaptOptions ya existe')
          PYEOF
          grep -A3 "aaptOptions" build.gradle

      - name: Dar permisos a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: VERIFICACIÓN FORZADA - ¿Los .gz están DENTRO del APK?
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          echo "🔍 Buscando .gz DENTRO del APK..."
          unzip -l "$APK" | grep -i "traineddata" || {
            echo "❌❌❌ FALLO CRÍTICO: NO hay traineddata dentro del APK"
            echo "Contenido de assets/public/tesseract/lang-data dentro del APK:"
            unzip -l "$APK" | grep -i "tesseract" || echo "No hay NADA de tesseract"
            exit 1
          }
          echo "✅✅✅ Los .gz SÍ están dentro del APK"

      - name: Renombrar APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/MarCaribe-v12.apk
          ls -lh output/

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MarCaribe-APK
          path: output/MarCaribe-v12.apk
          retention-days: 30
