name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Sincronizar Capacitor
        run: npx cap sync

      - name: Agregar Android si no existe
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
            npx cap sync
          fi

      - name: Parchear build.gradle para incluir .gz
        run: |
          echo "🔧 Parcheando build.gradle para permitir .gz..."
          cd android/app
          # Insertar aaptOptions al inicio del bloque android
          python3 -c "
          import re
          with open('build.gradle', 'r') as f:
              contenido = f.read()
          
          if 'aaptOptions' not in contenido:
              # Buscar el bloque android { y añadir aaptOptions justo después
              contenido = contenido.replace(
                  'android {',
                  'android {\n    aaptOptions {\n        noCompress \"gz\", \"traineddata\"\n        ignoreAssetsPattern \"!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~\"\n    }',
                  1
              )
              with open('build.gradle', 'w') as f:
                  f.write(contenido)
              print('✅ aaptOptions añadido')
          else:
              print('⚠️  aaptOptions ya existe, no se modifica')
          "
          echo ""
          echo "📄 Verificando parche:"
          grep -A3 "aaptOptions" build.gradle || echo "⚠️  No se aplicó el parche"

      - name: Dar permisos a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verificar que los .gz están en el APK
        run: |
          echo "🔍 Buscando .gz dentro del APK..."
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -i "traineddata" || echo "❌ Los .gz NO están en el APK"

      - name: Renombrar APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/MarCaribe-v12.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MarCaribe-APK
          path: output/MarCaribe-v12.apk
          retention-days: 30
