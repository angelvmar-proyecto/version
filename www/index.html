<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>MAR Caribe — Tablas</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #f1f5f9; padding: 8px; max-width: 100vw; overflow-x: hidden; }
    h1 { font-size: 1rem; text-align: center; margin-bottom: 8px; color: #38bdf8; }
    .botonera { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
    button { background: #1e40af; color: white; border: none; padding: 8px 4px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
    button:active { background: #3b82f6; }
    .area-imagen { width: 100%; height: 45vh; background: #1e293b; border-radius: 8px; overflow: auto; position: relative; margin: 8px 0; }
    canvas { display: block; transform-origin: top left; }
    .logs { background: #020617; padding: 8px; border-radius: 6px; font-family: monospace; font-size: 0.75rem; max-height: 25vh; overflow-y: auto; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>📊 MAR Caribe — Escáner de Tablas</h1>
  <div class="botonera">
    <button id="btnCargar">📷 Cargar Imagen</button>
    <button id="btnZoomMas">🔍+ Zoom</button>
    <button id="btnZoomMenos">🔍- Zoom</button>
    <button id="btnDetectar">🔎 Detectar Líneas</button>
    <button id="btnLeer">📖 Leer Texto</button>
    <button id="btnExportar">📋 Exportar</button>
  </div>
  <div class="area-imagen" id="areaImagen">
    <canvas id="lienzo"></canvas>
  </div>
  <div class="logs" id="logs"></div>
  <script src="js/app.js"></script>
</body>
</html>
