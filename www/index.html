<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAR Caribe — OCR</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 10px;
    }
    h2 { color: #00bcd4; text-align: center; font-size: 18px; margin: 10px 0; }
    .card {
      background: #1e1e1e;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
    }
    .botones {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    button {
      flex: 1 1 30%;
      background: #00bcd4;
      color: #000;
      border: none;
      padding: 10px 6px;
      border-radius: 5px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      min-width: 80px;
    }
    button:active { background: #008ba3; }
    .btn-verde { background: #4CAF50; color: #fff; }
    #areaImagen {
      width: 100%;
      overflow: auto;
      max-height: 60vh;
      background: #000;
      border-radius: 6px;
      border: 1px solid #333;
      margin-top: 8px;
    }
    #lienzo {
      display: block;
      max-width: 100%;
    }
    #logs {
      height: 150px;
      overflow-y: auto;
      background: #0a0a0a;
      padding: 8px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 11px;
      color: #9c9;
      margin-top: 8px;
      border: 1px solid #333;
    }
  </style>
</head>
<body>

  <h2>OCR Mar Caribe — Detección Real v1</h2>

  <div class="card">
    <div class="botones">
      <button id="btnCargar">📷 Cargar</button>
      <button id="btnZoomMas">🔍 +</button>
      <button id="btnZoomMenos">🔍 −</button>
    </div>
    <div class="botones">
      <button id="btnDetectar">🎯 Detectar líneas</button>
      <button id="btnLeer">📖 Leer OCR</button>
      <button id="btnExportar" class="btn-verde">📥 Exportar</button>
    </div>

    <div id="areaImagen">
      <canvas id="lienzo"></canvas>
    </div>

    <div id="logs"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
