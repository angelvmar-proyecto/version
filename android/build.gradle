buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.1.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Repositorio oficial de Ionic/Capacitor
        maven { url "https://ionic-team.github.io/capacitor/maven/" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
